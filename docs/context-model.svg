<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="880"
    viewBox="0 0 1000 880"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Session history and the agent's model context</title>
    <desc id="description">
        The session history keeps the original messages for blocks b1 through b4. In the agent's
        context, active summaries replace b1, b2, and b4. Block b3 is culled, so its summary is not
        sent and its original messages stay out of context. The model also receives system prompts,
        tool descriptions, the memo, injected skills, and uncompressed messages. recall_compressed
        can retrieve original messages from any block, including culled b3, as a tool result. Both
        columns are excerpts, and the message and block IDs are examples.
    </desc>
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#475569" />
        </marker>
        <marker id="recall-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#0f766e" />
        </marker>
        <style>
            text {
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                fill: #0f172a;
            }
            .heading {
                font-size: 23px;
                font-weight: 700;
            }
            .label {
                font-size: 17px;
                font-weight: 600;
            }
            .body {
                font-size: 15px;
            }
            .row {
                font-size: 15px;
            }
            .small {
                font-size: 13px;
                fill: #334155;
            }
            .tiny {
                font-size: 12px;
                fill: #64748b;
            }
            .panel {
                fill: #ffffff;
                stroke: #64748b;
                stroke-width: 2;
            }
            .flow {
                fill: none;
                stroke: #475569;
                stroke-width: 2;
                marker-end: url(#arrow);
            }
            .recall {
                fill: none;
                stroke: #0f766e;
                stroke-width: 2;
                stroke-dasharray: 6 4;
                marker-end: url(#recall-arrow);
            }
        </style>
    </defs>
    <rect width="1000" height="880" rx="16" fill="#f8fafc" />
    <text x="24" y="46" class="heading">Session history</text>
    <text x="24" y="71" class="small">Excerpt of the original conversation</text>
    <text x="560" y="46" class="heading">Agent context</text>
    <text x="560" y="71" class="small">Excerpt of the model's input, in order</text>

    <rect x="24" y="96" width="400" height="720" rx="12" class="panel" />
    <text x="44" y="126" class="label">Original messages</text>

    <rect x="44" y="142" width="360" height="94" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" />
    <text x="60" y="168" class="body">b1 · m0001–m0020</text>
    <text x="60" y="190" class="small">Active summary · v1</text>
    <text x="60" y="210" class="small">summary sent instead of these messages</text>

    <rect x="44" y="246" width="360" height="94" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" />
    <text x="60" y="272" class="body">b2 · m0021–m0040</text>
    <text x="60" y="294" class="small">Active summary · v1</text>
    <text x="60" y="314" class="small">summary sent instead of these messages</text>

    <rect
        x="44"
        y="350"
        width="360"
        height="94"
        rx="8"
        fill="#f1f5f9"
        stroke="#94a3b8"
        stroke-width="2"
        stroke-dasharray="6 4"
    />
    <text x="60" y="376" class="body" fill="#475569">b3 · m0041–m0058</text>
    <text x="60" y="398" class="small" fill="#475569">Culled · v0</text>
    <text x="60" y="418" class="small" fill="#475569">no summary sent; messages stay out</text>

    <rect x="44" y="454" width="360" height="94" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" />
    <text x="60" y="480" class="body">b4 · m0059–m0080</text>
    <text x="60" y="502" class="small">Active summary · v1</text>
    <text x="60" y="522" class="small">summary sent instead of these messages</text>

    <rect x="44" y="558" width="360" height="94" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text x="60" y="584" class="body">Uncompressed messages</text>
    <text x="60" y="606" class="small">m0081–m0095</text>
    <text x="60" y="626" class="small">sent as-is</text>

    <path d="M440 189 V501" fill="none" stroke="#475569" stroke-width="2" />
    <path d="M432 189 H440" fill="none" stroke="#0369a1" stroke-width="2" />
    <path d="M432 293 H440" fill="none" stroke="#0369a1" stroke-width="2" />
    <path d="M432 397 H440" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" />
    <path d="M432 501 H440" fill="none" stroke="#0369a1" stroke-width="2" />
    <path d="M440 200 H478 V262 H552" class="flow" />
    <text x="484" y="250" class="small">Summaries</text>

    <rect x="560" y="96" width="416" height="720" rx="12" class="panel" />
    <text x="580" y="126" class="label">Model input</text>

    <rect x="580" y="142" width="376" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="594" y="162" class="row">System prompts</text>

    <rect x="580" y="177" width="376" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="594" y="197" class="row">Tool descriptions</text>

    <rect x="580" y="212" width="376" height="30" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" />
    <text x="594" y="232" class="row">Block b1 summary</text>

    <rect x="580" y="247" width="376" height="30" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" />
    <text x="594" y="267" class="row">Block b2 summary</text>

    <text x="594" y="292" class="tiny">b3 culled — no summary sent</text>

    <rect x="580" y="300" width="376" height="30" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" />
    <text x="594" y="320" class="row">Block b4 summary</text>

    <rect x="580" y="335" width="376" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="594" y="355" class="row">Memo content</text>

    <rect x="580" y="370" width="376" height="30" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
    <text x="594" y="390" class="row">Injected skills</text>

    <rect x="580" y="405" width="376" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="594" y="425" class="row">Message outside the compression range</text>

    <rect x="580" y="440" width="376" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="594" y="460" class="row">Message</text>

    <rect x="580" y="475" width="376" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="768" y="495" class="small" text-anchor="middle">…</text>

    <rect x="580" y="510" width="376" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="594" y="530" class="row">Message</text>

    <rect
        x="580"
        y="545"
        width="376"
        height="30"
        rx="6"
        fill="#f0fdfa"
        stroke="#0f766e"
        stroke-width="1.5"
        stroke-dasharray="6 4"
    />
    <text x="594" y="565" class="row">Tool call · recall_compressed</text>

    <rect
        x="580"
        y="588"
        width="376"
        height="62"
        rx="6"
        fill="#f0fdfa"
        stroke="#0f766e"
        stroke-width="1.5"
        stroke-dasharray="6 4"
    />
    <text x="594" y="607" class="tiny">Tool result</text>
    <rect x="590" y="616" width="172" height="32" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="602" y="638" class="body">b1 · m0012</text>
    <rect x="772" y="616" width="172" height="32" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="784" y="638" class="body">b3 · m0046</text>

    <rect x="580" y="658" width="376" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="594" y="678" class="row">Message</text>

    <rect
        x="580"
        y="696"
        width="376"
        height="30"
        rx="6"
        fill="#ffedd5"
        stroke="#ea580c"
        stroke-width="1.5"
        stroke-dasharray="4 3"
    />
    <text x="594" y="716" class="row">Active thinking tokens</text>

    <rect x="580" y="731" width="376" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="594" y="751" class="row">Tool call</text>

    <rect x="580" y="766" width="376" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="768" y="786" class="small" text-anchor="middle">…</text>

    <path
        d="M440 189 H452 M440 293 H452 M440 397 H452 M440 501 H452"
        fill="none"
        stroke="#0f766e"
        stroke-width="2"
        stroke-dasharray="3 3"
    />
    <path d="M452 189 V632 H572" class="recall" />

    <text x="500" y="850" class="small" text-anchor="middle">
        Example message and block IDs · dashed teal path: optional recall
    </text>
</svg>
