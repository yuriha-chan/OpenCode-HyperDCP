<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="1130"
    viewBox="0 0 1000 1130"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Session history and the agent's model context, row by row</title>
    <desc id="description">
        Two aligned columns. The session history lists original messages in order, colored by kind:
        user messages, assistant messages, tool calls, tool results, skill load and its result, and
        generic messages. Each compression block brackets its messages on the left; a single
        connector trunk collects every bracket and every recalled message, and branches right into
        the model input. The branches land on block b1, b2 and b4 summaries with their versions and
        message ranges, on a culled marker for b3, and on the tool result of recall_compressed,
        which returns original messages from b1 and culled b3 as message blocks. The model input
        also contains system prompts, tool descriptions, the memo, injected skills, and the
        uncompressed messages after b4, then the next user message, active thinking and tool calls.
        The columns are excerpts, and message and block IDs are examples.
    </desc>
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#475569" />
        </marker>
