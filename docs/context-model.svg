                stroke: #94a3b8;
                stroke-dasharray: 6 4;
            }
            .assistant-culled {
                fill: #dcfce7;
                stroke: #94a3b8;
                stroke-dasharray: 6 4;
            }
            .culled {
                fill: #f1f5f9;
                stroke: #94a3b8;
                stroke-dasharray: 6 4;
            }
            .host {
                fill: #e2e8f0;
                stroke: #64748b;
            }
            .summary {
