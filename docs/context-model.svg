                stroke: #db2777;
                stroke-dasharray: 4 3;
            }
            .gap {
                fill: #ffffff;
                stroke: #e2e8f0;
                stroke-dasharray: 4 3;
            }
            .bracket {
                fill: none;
                stroke: #475569;
                stroke-width: 2;
            }
            .bracket-culled {
                fill: none;
                stroke: #94a3b8;
                stroke-width: 2;
                stroke-dasharray: 5 4;
            }
            .link {
                fill: none;
                stroke: #475569;
                stroke-width: 2;
            }
            .link-out {
                fill: none;
                stroke: #475569;
                stroke-width: 2;
                marker-end: url(#arrow);
            }
        </style>
    </defs>

