                stroke: #64748b;
                stroke-width: 2;
            }
            .plain {
                fill: #ffffff;
                stroke: #cbd5e1;
                stroke-width: 1.5;
            }
            .muted {
                fill: #f1f5f9;
                stroke: #cbd5e1;
                stroke-width: 1.5;
            }
            .active {
                fill: #e0f2fe;
                stroke: #0369a1;
                stroke-width: 1.5;
            }
            .culled {
                fill: #f1f5f9;
                stroke: #94a3b8;
                stroke-width: 1.5;
                stroke-dasharray: 6 4;
            }
            .gap {
                fill: #ffffff;
                stroke: #e2e8f0;
                stroke-width: 1.5;
                stroke-dasharray: 4 3;
            }
            .memo {
                fill: #fef3c7;
                stroke: #d97706;
                stroke-width: 1.5;
            }
            .skills {
                fill: #f3e8ff;
                stroke: #9333ea;
                stroke-width: 1.5;
            }
            .recallcell {
                fill: #f0fdfa;
                stroke: #0f766e;
                stroke-width: 1.5;
                stroke-dasharray: 6 4;
            }
            .thinking {
                fill: #ffedd5;
                stroke: #ea580c;
                stroke-width: 1.5;
                stroke-dasharray: 4 3;
            }
            .tool {
                fill: #dcfce7;
                stroke: #16a34a;
                stroke-width: 1.5;
            }
            .faint {
                fill: #f8fafc;
                stroke: #e2e8f0;
                stroke-width: 1.5;
            }
            .bracket {
                fill: none;
                stroke: #0369a1;
                stroke-width: 2;
            }
            .bracket-culled {
                fill: none;
                stroke: #94a3b8;
                stroke-width: 2;
                stroke-dasharray: 5 4;
            }
            .lead {
                fill: none;
                stroke: #475569;
                stroke-width: 2;
                marker-end: url(#arrow);
            }
            .lead-culled {
                fill: none;
                stroke: #94a3b8;
                stroke-width: 2;
                stroke-dasharray: 5 4;
                marker-end: url(#cull-arrow);
            }
            .recall {
                fill: none;
                stroke: #0f766e;
                stroke-width: 2;
                stroke-dasharray: 6 4;
                marker-end: url(#recall-arrow);
            }
            .recall-stub {
                fill: none;
                stroke: #0f766e;
                stroke-width: 2;
                stroke-dasharray: 3 3;
            }
        </style>
