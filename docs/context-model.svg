<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="1170"
    viewBox="0 0 1000 1170"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Session history and the agent's model context, row by row</title>
    <desc id="description">
        Two aligned columns. The session history lists the original messages in order: user and
        assistant messages, tool calls and results, a skill load and its result, and messages that
        follow. Each compression block brackets its messages on the left and aligns with a single
        row on the right holding that block's summary: b1, b2 and b4 have active summaries with
        their versions and message ranges, while b3 is culled, so its bracket maps to a culled
        marker instead of a summary. The model input also contains system prompts, tool
        descriptions, the memo, injected skills, and the uncompressed messages after b4. Further
        down, a recall_compressed tool call returns original messages from b1 and culled b3, drawn
        as message blocks inside the tool result. The columns are excerpts, and message and block
        IDs are examples.
    </desc>
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#475569" />
        </marker>
        <marker id="cull-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#94a3b8" />
        </marker>
        <marker id="recall-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#0f766e" />
        </marker>
        <style>
